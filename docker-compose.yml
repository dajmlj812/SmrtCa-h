# SmrtCash — full self-hosted stack.
#
# `docker compose -p smrtcash up -d` brings up PostgreSQL plus the
# single-container API+web service. The image is built from the repo root
# Dockerfile; the running service migrates the database at startup, serves
# /api/* on port 4000, and serves the prebuilt web SPA at every other path.
#
# All persistent state lives in two named volumes:
#   smrtcash-db-data       — PostgreSQL cluster
#   smrtcash-attachments   — receipt files (uploaded via /api/attachments)
#
# Secrets (DB password, session secret, attachment encryption key) are
# expected in .env (gitignored). Generate the keys with:
#   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"

services:
  db:
    image: postgres:17-alpine
    container_name: smrtcash-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Exposed so host-side tools (vitest, psql, npm run backup) can reach
    # the DB. The app container talks to it internally over the Docker
    # network at `db:5432`. Remove this mapping for a more locked-down
    # deployment (Postgres won't be reachable off-host).
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - smrtcash-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smrtcash-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `db` is the compose service name — resolved by the internal network.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: 4000
      ATTACHMENTS_DIR: /data/attachments
      # Required for sessions to survive a restart.
      SESSION_SECRET: ${SESSION_SECRET}
      # Optional — when unset, attachments are written to disk in plaintext.
      ATTACHMENT_ENCRYPTION_KEY: ${ATTACHMENT_ENCRYPTION_KEY:-}
      # Set to 1 when a TLS-terminating reverse proxy is in front so the
      # session cookie is sent with the Secure flag.
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # AI provider (optional).
      AI_PROVIDER: ${AI_PROVIDER:-rules}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      # Fuel prices (Phase 7.1) — optional EIA key for auto-refresh.
      EIA_API_KEY: ${EIA_API_KEY:-}
      # Stripe (0.15.x — SaaS billing). All optional at boot;
      # billing routes 503 until set. See docs/STRIPE_SETUP.md.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLIC_BASE_URL: ${STRIPE_PUBLIC_BASE_URL:-http://localhost:4000}
      # 0.18.13 — perf knobs. If set in the host .env we honor that
      # (the entrypoint script bypasses the DB lookup). Otherwise
      # NODE_OPTIONS is read from app_settings at start. The other
      # three are read directly by Node at module load.
      NODE_OPTIONS: ${NODE_OPTIONS:-}
      PG_POOL_MAX: ${PG_POOL_MAX:-}
      OCR_TIMEOUT_MS: ${OCR_TIMEOUT_MS:-}
      SLOW_QUERY_THRESHOLD_MS: ${SLOW_QUERY_THRESHOLD_MS:-}
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - smrtcash-attachments:/data/attachments
      # F-31 (security audit 2026-05-25) — backups live on disk so
      # they need a writable mount too. Backups directory is
      # /data/backups by default; the BACKUP_DIR setting overrides.
      - smrtcash-backups:/data/backups
    # F-31 — container hardening. The runtime image already uses a
    # non-root `node` user (Dockerfile USER directive). These compose-
    # level options layer defense-in-depth:
    #   • read_only rootfs: the only writable paths are the explicit
    #     volume mounts above (/data/attachments, /data/backups) + the
    #     tmpfs below. A successful RCE can't drop a payload into /app
    #     or anywhere else on the image filesystem.
    #   • tmpfs for /tmp: Node needs a writable temp dir; this gives
    #     it 64MB in RAM, not on disk, and it's cleared on restart.
    #   • cap_drop ALL + no-new-privileges: container starts with the
    #     minimal Linux capability set Node needs; CAP_NET_BIND_SERVICE
    #     and friends aren't required since we bind on the unprivileged
    #     port 4000.
    #   • security_opt no-new-privileges: even if a process inside
    #     the container has setuid bits, it can't elevate.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  smrtcash-db-data:
  smrtcash-attachments:
  smrtcash-backups:
